<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#050505" />
        <meta
            name="description"
            content="ArcVox Private Studio — self-hosted voice, cloning, transcription and avatar studio. Your data never leaves your server."
        />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <title>ArcVox Private Studio</title>
        <!--
            No third-party analytics, trackers, or external scripts.
            Fonts are bundled and served from this origin (see src/index.css).
            This page makes zero outbound requests to anyone but your own server.
        -->
        <script>
            // Suppress a benign cross-origin DataCloneError some browsers raise
            // for PerformanceServerTiming; keeps the console clean. Local-only.
            window.addEventListener(
                "error",
                function (e) {
                    if (
                        e.error instanceof DOMException &&
                        e.error.name === "DataCloneError" &&
                        e.message &&
                        e.message.includes("PerformanceServerTiming")
                    ) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                    }
                },
                true,
            );
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
