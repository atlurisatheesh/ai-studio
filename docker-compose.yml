# ArcVox Private Studio — self-hosted deployment
#
# CPU-only host:   docker compose up
# GPU host:        docker compose --profile gpu up
#
# The GPU profile adds Ollama (local LLM) with GPU acceleration. Install
# Chatterbox + SadTalker on the host per README for HD voice cloning and
# avatar lipsync.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@arcvox.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      TTS_ENGINE: ${TTS_ENGINE:-auto}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      AVATAR_ENGINE: ${AVATAR_ENGINE:-none}
    volumes:
      - arcvox_data:/app/data        # SQLite DB + uploads + outputs — all user data lives here
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8001}
    ports:
      - "3000:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  ollama-gpu:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  arcvox_data:
  ollama_models:
